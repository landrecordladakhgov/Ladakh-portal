<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Records - UT Administration of Ladakh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #525659;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .document-container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .document-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        @media (min-width: 800px) {
            body {
                padding: 30px 0;
            }
            .document-container {
                border-radius: 4px;
                overflow: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="document-container">
        <img src="Certificate.png" alt="Document Verification">
    </div>
</body>
</html>
