<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Records - UT Administration of Ladakh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #525659;
            display: flex;
            justify-content: center;
            align-items: flex-start;

        embed {

            height: 100%;
            border: none;
        }

<body>
    <div class="pdf-container">
        <embed src="Certificate.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf">
