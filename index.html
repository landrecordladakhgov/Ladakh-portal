<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Records - UT Administration of Ladakh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #525659;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .doc-wrapper {
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }
        .doc-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="doc-wrapper">
        <img src="Certificate.png" alt="Document Verification">
    </div>
</body>
</html>
