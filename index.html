<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Records - UT Administration of Ladakh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #ffffff;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .document-container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
        }
        .document-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="document-container">
        <img src="Certificate.png" alt="Document Verification">
    </div>
</body>
</html>
