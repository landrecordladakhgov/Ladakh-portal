<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Land Records - UT Administration of Ladakh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #525659;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }
        .viewer-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .viewer-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <img src="Certificate.png" alt="Document Verification">
    </div>
</body>
</html>
